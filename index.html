<!DOCTYPE html>

<html lang="en">

	<head>

		<meta charset="utf-8">

		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>Sugar Clicker</title>

		<link rel="stylesheet" href="styles.css">

	</head>

 

	<body>
		<div class="outer"> 
			<div class="main-container">

				<div class="top-section">
					<div class="box titleCard">Sugar Clicker</div>
					<div class="moneyGroup">
						<img id="money" src="money.png" draggable="false"/>
						<div id="moneyTracker">###</div>
					</div>
					<button class="menuButton">MENU</button>	
				</div>
				
				

				<div class="bottom-section">
					<div class="box playArea">
						<div class="box leftSide">																				   
							<div class="box sugarContainer">
								<img id="sugar" src="bagosugar.png" draggable="false"/>
								<div id="sugarTotal">###</div>
								<button id="sell">SELL</button>
								<div id="sps">### sugar per second</div>
							</div>
						</div>
						<div class="box rightSide">
							<div class="box buildingContainer">
								<div class="box sugarMaker">
									<img id="chemist" src="chemist.png" draggable="false"/>
									<div class="chemText">Sugar Cooker</div>
									<div id="chemNum">###</div>
									<div id="chemCost">$###</div>
								</div>
								<div class="box candyMaker">CANDY MAKER</div>
								<div class="box cornFarmer">CORN FARMER</div>
								
							</div>  
						</div> 
					</div>
				</div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>r
</html>
